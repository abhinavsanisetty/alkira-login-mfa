<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Authentication demo: login, multi-factor verification, and role-based access control."
    />
    <title>Alkira Console</title>
    <script>
      /*
        Stamps the theme before first paint.

        This has to be inline and synchronous. If the attribute were applied
        from React after hydration, every dark-mode user would see one frame of
        the light palette first, which is the flash-of-wrong-theme problem.
        Reading localStorage and stamping the attribute costs under a
        millisecond and happens before the body renders.

        The attribute is always written, never omitted. There is no
        "follow the system" state, so an un-stamped document would be a state
        the stylesheet has no rule for.
      */
      (function () {
        var choice = "light";
        try {
          var stored = localStorage.getItem("alkira.theme");
          if (stored === "light" || stored === "dark") choice = stored;
        } catch (_) {
          /* Private browsing can throw on storage access. The default is a
             perfectly good fallback, so there is nothing to handle. */
        }
        document.documentElement.setAttribute("data-theme", choice);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
