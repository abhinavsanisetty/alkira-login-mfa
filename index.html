<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Authentication demo: login, multi-factor verification, and role-based access control."
    />
    <title>Alkira Console</title>
    <script>
      /*
        Stamps the theme before first paint. Applying it from React after
        hydration would show every dark-mode user one frame of the light
        palette. Always written, never omitted: there is no "follow the system"
        state for the stylesheet to have a rule for.
      */
      (function () {
        var choice = "light";
        try {
          var stored = localStorage.getItem("alkira.theme");
          if (stored === "light" || stored === "dark") choice = stored;
        } catch (_) {
          /* Private browsing can throw; the default is a fine fallback. */
        }
        document.documentElement.setAttribute("data-theme", choice);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
